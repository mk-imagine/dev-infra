name: Build py-sci-psy

on:
  push:
    branches: [main]
    paths:
      - "py-sci-psy/**"
      # Changing this file changes how the image is built, so it has to build
      # too. Otherwise a broken workflow merges without ever running.
      - ".github/workflows/build-py-sci-psy.yml"
  # Pull requests build and smoke-test both architectures but publish nothing:
  # the login, every push step, and the merge job are skipped for this event.
  pull_request:
    paths:
      - "py-sci-psy/**"
      - ".github/workflows/build-py-sci-psy.yml"
  workflow_dispatch:

# A newer push to the same pull request replaces a run still in progress. Runs
# on main queue instead of cancelling: a cancelled run could stop after a leg
# has pushed its digest but before the merge job has tagged anything.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/mk-imagine/py-sci-psy

jobs:
  build:
    # One runner per architecture, each building its own platform natively.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      # Artifact names may not contain "/", so linux/amd64 becomes linux-amd64.
      - name: Prepare platform slug
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_SLUG=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only -- no tags. Each leg pushes an untagged, by-digest image and
      # the merge job binds :latest and :<sha> to the manifest list. If a leg
      # tagged its own push, the two architectures would race, each overwriting
      # the other with a single-arch image.
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}

      # Build into the runner's local Docker first, so the image can be run
      # before anything is published.
      - name: Build for smoke test
        uses: docker/build-push-action@v7
        with:
          context: py-sci-psy
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          tags: smoke-test:local
          # Scoped per image and platform, so neither the two legs nor two
          # images evict each other's layers.
          cache-from: type=gha,scope=py-sci-psy-${{ matrix.platform }}
          # Pull requests read main's cache but never write to it. A PR's
          # entries are invisible to main yet count against the same 10GB
          # repository cap, where they would evict main's layers.
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,mode=max,scope=py-sci-psy-{0}', matrix.platform) || '' }}

      # Runs <image>/smoke-test.sh inside the image. The devcontainer.metadata
      # label is passed in as an environment variable, because a label cannot be
      # read from inside the container; it is empty for images without one.
      - name: Smoke test
        run: |
          metadata=$(docker image inspect smoke-test:local --format '{{json .Config.Labels}}' \
            | jq -r '.["devcontainer.metadata"] // ""')
          docker run --rm --entrypoint /bin/sh \
            -e DEVCONTAINER_METADATA="$metadata" \
            -v "$GITHUB_WORKSPACE/py-sci-psy/smoke-test.sh:/smoke-test.sh:ro" \
            smoke-test:local /smoke-test.sh

      # Rebuilds from this runner's builder cache, so every layer pushed is a
      # layer that was just tested; the step only exports and uploads.
      - name: Push by digest
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: py-sci-psy
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=py-sci-psy-${{ matrix.platform }}

      # The artifact is the digest itself, carried as an empty file named after
      # it -- the merge job only needs the identifiers, not the images.
      - name: Export digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_SLUG }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    # Binds the per-arch digests into one multi-arch manifest list and tags it.
    # Until this runs, nothing published by the build job is reachable by tag.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Create manifest list and push
        working-directory: /tmp/digests
        # Built as an array so every tag and digest stays one argument without
        # relying on unquoted word splitting.
        run: |
          args=()
          while IFS= read -r tag; do
            args+=(-t "$tag")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for digest in *; do
            args+=("${IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create "${args[@]}"

      # Fails the run if the manifest is not genuinely multi-arch, so a
      # half-published image cannot pass silently.
      - name: Verify both architectures are present
        run: |
          docker buildx imagetools inspect "${IMAGE}:latest"
          for arch in amd64 arm64; do
            docker buildx imagetools inspect --raw "${IMAGE}:latest" \
              | jq -e --arg a "$arch" \
                  '.manifests | map(select(.platform.architecture == $a and .platform.os == "linux")) | length > 0' \
                  >/dev/null \
              || { echo "::error::linux/$arch missing from ${IMAGE}:latest manifest"; exit 1; }
            echo "ok: linux/$arch present"
          done

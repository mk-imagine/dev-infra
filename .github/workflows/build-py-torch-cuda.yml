name: Build py-torch-cuda

on:
  push:
    branches: [main]
    paths:
      - "py-torch-cuda/**"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/mk-imagine/py-torch-cuda

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      # No docker/setup-qemu-action here, unlike every other workflow in this
      # repo: PyTorch publishes CUDA wheels for linux/x86_64 only, so this image
      # is amd64-only and builds natively on the runner. Adding QEMU would only
      # slow it down.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # This step is load-bearing, not precautionary. The built image measures
      # 8.07GB (torch + torchvision + the vendored nvidia-* CUDA 13.2 runtime,
      # of which cuDNN alone is ~2GB), and the build needs room for the pip
      # download, the unpacked layer, and the export on top of that. Reclaim the
      # preinstalled toolchains this build never touches so it fails on its
      # merits rather than on ENOSPC.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      # Note the absent cache-from/cache-to: type=gha that every other image in
      # this repo uses. GitHub caps a repository at 10GB of Actions cache and
      # evicts LRU across the whole repo -- and this image is 8.07GB, so caching
      # it would consume nearly the entire budget and evict the layer cache for
      # all eleven other images here. A measured cold build is 3m50s (78s pip,
      # 124s layer export), which is cheap enough to prefer over that.
      - uses: docker/build-push-action@v7
        with:
          context: py-torch-cuda
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
